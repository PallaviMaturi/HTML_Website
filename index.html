
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>
        <p>This is my first HTML webpage hosted using Vercel.</p>
        <p>Created by: M. Pallavi</p>
        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>
</body>
</html>
